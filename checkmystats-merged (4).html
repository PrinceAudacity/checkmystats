<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CheckMyStats — Engineering Skill Tree</title>
<style>
:root {
  --bg-canvas:#0e0e1a;--bg-panel:rgba(10,10,18,0.92);--bg-panel-solid:#09090f;
  --bg-hover:rgba(255,255,255,0.045);--accent-blue:#3A7BFF;--accent-blue-dim:rgba(58,123,255,0.13);
  --accent-blue-glow:rgba(58,123,255,0.4);--accent-violet:#7C5CFF;--accent-amber:#F5A623;
  --text-main:#E8E8F0;--text-dim:#555577;--text-dark:#9090A8;
  --border-light:rgba(255,255,255,0.07);--border-blue:rgba(58,123,255,0.45);
  --gold:#c8a84b;--gold-dim:rgba(200,168,75,.18);--gold-glow:rgba(200,168,75,.5);
  --radius-sm:5px;--radius-pill:24px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  --font-mono:"SF Mono","Roboto Mono",Menlo,monospace;
}
body.light {
  --bg-canvas:#EEF0F8;--bg-panel:rgba(255,255,255,0.94);--bg-panel-solid:#FFFFFF;
  --bg-hover:rgba(0,0,0,0.04);--accent-blue-dim:rgba(58,123,255,0.1);
  --accent-blue-glow:rgba(58,123,255,0.25);--text-main:#12122a;--text-dim:#9090b0;--text-dark:#505068;
  --border-light:rgba(0,0,0,0.08);--border-blue:rgba(58,123,255,0.35);
  --gold:#9a7a20;--gold-dim:rgba(154,122,32,.12);--gold-glow:rgba(154,122,32,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-canvas);color:var(--text-main);font-family:var(--font);font-size:13px;
  height:100vh;overflow:hidden;display:grid;
  grid-template-columns:56px 240px 1fr 300px;grid-template-rows:48px 1fr;
  grid-template-areas:"nav nav nav nav" "toolbar sidebar canvas panel";
  -webkit-font-smoothing:antialiased;transition:background-color .35s}
.label-caps{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);font-weight:600}
.pill-tag{padding:3px 8px;border-radius:var(--radius-sm);font-size:10px;border:1px solid var(--border-light);color:var(--text-dark);display:inline-block}
header{grid-area:nav;background:var(--bg-panel-solid);border-bottom:1px solid var(--border-light);display:flex;align-items:center;padding:0 20px;z-index:100}
.logo{font-weight:600;font-size:14px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.logo::before{content:'';display:block;width:10px;height:10px;background:linear-gradient(135deg,var(--accent-blue),var(--accent-violet));border-radius:3px;box-shadow:0 0 10px var(--accent-blue-glow)}
.hdr-path{margin-left:20px;padding-left:20px;border-left:1px solid var(--border-light);color:var(--text-dim);font-size:12px;display:flex;align-items:center;gap:6px}
.hdr-path .active-path{color:var(--accent-amber);font-weight:500}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.theme-toggle{width:32px;height:32px;border-radius:var(--radius-pill);border:1px solid var(--border-light);background:var(--bg-hover);color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center}
.theme-toggle:hover{color:var(--text-main)}
.theme-toggle .icon-moon{display:block}.theme-toggle .icon-sun{display:none}
body.light .theme-toggle .icon-moon{display:none}body.light .theme-toggle .icon-sun{display:block}
.hdr-btn{padding:5px 12px;border-radius:var(--radius-sm);border:1px solid var(--border-light);background:transparent;color:var(--text-dim);font-size:11px;cursor:pointer;font-family:var(--font)}
.hdr-btn:hover{color:var(--text-main);border-color:rgba(255,255,255,.18)}
.toolbar{grid-area:toolbar;background:var(--bg-panel-solid);border-right:1px solid var(--border-light);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:6px;z-index:5}
.tool-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);cursor:pointer;position:relative;transition:background .15s,color .15s}
.tool-icon:hover{color:var(--text-main);background:var(--bg-hover)}
.tool-icon.active{background:var(--accent-blue-dim);color:var(--accent-blue)}
.tool-tooltip{position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);background:var(--bg-panel-solid);border:1px solid var(--border-light);color:var(--text-main);font-size:11px;white-space:nowrap;padding:4px 10px;border-radius:var(--radius-sm);pointer-events:none;opacity:0;transition:opacity .15s;z-index:100}
.tool-icon:hover .tool-tooltip{opacity:1}
.sidebar{grid-area:sidebar;background:var(--bg-panel);border-right:1px solid var(--border-light);display:flex;flex-direction:column;z-index:4;overflow:hidden}
.sidebar-header{padding:12px 12px 0;display:flex;flex-direction:column;gap:10px}
.search-box{background:rgba(255,255,255,.03);border:1px solid var(--border-light);border-radius:var(--radius-sm);padding:8px 10px;display:flex;align-items:center;gap:8px;position:relative}
.search-box:focus-within{border-color:rgba(58,123,255,.4)}
.search-box input{background:transparent;border:none;color:var(--text-main);font-size:13px;width:100%;outline:none}
.search-box input::placeholder{color:var(--text-dim)}
.search-dropdown{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--bg-panel-solid);border:1px solid var(--border-blue);border-radius:var(--radius-sm);overflow-y:auto;z-index:200;display:none;box-shadow:0 8px 24px rgba(0,0,0,.5);max-height:320px}
.search-dropdown.visible{display:block}
.search-result-item{padding:8px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid rgba(255,255,255,.04)}
.search-result-item:last-child{border-bottom:none}
.search-result-item:hover,.search-result-item.hi{background:var(--accent-blue-dim)}
.search-result-name{font-size:12px;font-weight:500;color:var(--text-main)}
.search-result-meta{font-size:10px;color:var(--text-dim);display:flex;gap:6px}
.search-no-results{padding:12px 14px;color:var(--text-dim);font-size:12px}
.mode-tabs{display:flex;border-bottom:1px solid var(--border-light);flex-shrink:0}
.mode-tab{flex:1;padding:9px 0;text-align:center;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
.mode-tab:hover{color:var(--text-dark)}
.mode-tab.active{color:var(--accent-blue);border-bottom-color:var(--accent-blue)}
.list-section{flex:1;overflow-y:auto;padding:8px}
.list-group-label{padding:10px 10px 5px;font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim);font-weight:600}
.list-item{padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;display:flex;align-items:center;gap:8px;margin-bottom:1px;position:relative;font-size:12px;transition:background .15s}
.list-item:hover{background:var(--bg-hover)}
.list-item.active{background:var(--accent-blue-dim);border:1px solid var(--border-blue)}
.list-item .cat-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.list-item .li-name{flex:1;font-weight:500}
.list-item .li-count{font-size:10px;color:var(--text-dim);font-family:var(--font-mono)}
.list-item .li-remove{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-dim);opacity:0;transition:opacity .15s;font-size:14px;flex-shrink:0}
.list-item:hover .li-remove{opacity:1}
.list-item .li-remove:hover{color:#e05555;background:rgba(224,85,85,.12)}
.modal-overlay{position:fixed;inset:0;background:rgba(8,8,16,.75);backdrop-filter:blur(6px);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .22s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--bg-panel-solid);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:24px;width:400px;max-width:calc(100vw - 40px);box-shadow:0 24px 60px rgba(0,0,0,.6);transform:translateY(10px) scale(.98);transition:transform .22s}
.modal-overlay.open .modal{transform:translateY(0) scale(1)}
.modal h3{font-size:15px;font-weight:600;margin-bottom:4px}
.modal p{font-size:12px;color:var(--text-dark);margin-bottom:16px;line-height:1.5}
.modal-list{display:flex;flex-direction:column;gap:4px;max-height:340px;overflow-y:auto;margin-bottom:16px}
.modal-career-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--border-light);cursor:pointer;transition:border-color .15s,background .15s}
.modal-career-item:hover{border-color:var(--border-blue);background:var(--accent-blue-dim)}
.modal-career-item.disabled{opacity:.35;pointer-events:none}
.mci-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.mci-info{flex:1}.mci-name{font-size:12px;font-weight:500}.mci-meta{font-size:10px;color:var(--text-dim)}
.modal-cancel{width:100%;background:transparent;border:1px solid var(--border-light);color:var(--text-dim);padding:9px;border-radius:var(--radius-sm);font-size:12px;cursor:pointer;font-family:var(--font)}
.modal-cancel:hover{color:var(--text-main)}
.canvas-area{grid-area:canvas;position:relative;overflow:hidden}
#cvs-wrap{position:absolute;inset:0;cursor:grab;overflow:hidden}
#cvs-wrap:active{cursor:grabbing}
canvas{position:absolute;top:0;left:0}
.zoom-ctl{position:absolute;bottom:20px;left:16px;display:flex;flex-direction:column;gap:4px;z-index:20}
.zb{width:28px;height:28px;background:var(--bg-panel-solid);border:1px solid var(--border-light);border-radius:var(--radius-sm);color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;user-select:none}
.zb:hover{color:var(--text-main)}
.zlbl{text-align:center;font-size:9px;font-family:var(--font-mono);color:var(--text-dim);padding:2px 0}
#tip{position:fixed;pointer-events:none;background:var(--bg-panel-solid);border:1px solid rgba(200,168,75,.3);border-radius:var(--radius-sm);padding:8px 11px;font-size:11px;color:var(--text-main);box-shadow:0 4px 20px rgba(0,0,0,.6);opacity:0;transition:opacity .1s;z-index:200;max-width:220px}
#tip.vis{opacity:1}
#tip-name{font-weight:600;font-size:12px;margin-bottom:2px}
#tip-meta{color:var(--text-dim)}
.path-info{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--bg-panel-solid);border:1px solid rgba(200,168,75,.3);border-radius:var(--radius-pill);padding:4px 14px;font-size:11px;color:var(--gold);z-index:20;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.path-info.vis{opacity:1}
.legend{position:absolute;bottom:20px;right:16px;background:var(--bg-panel-solid);border:1px solid var(--border-light);border-radius:var(--radius-sm);padding:10px 12px;z-index:20;font-size:11px}
.leg-row{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.leg-row:last-child{margin-bottom:0}
.leg-label{color:var(--text-dark)}
.right-panel{grid-area:panel;background:var(--bg-panel);border-left:1px solid var(--border-light);display:flex;flex-direction:column;z-index:4;overflow:hidden}
.rp-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:12px;text-align:center;padding:20px}
.panel-header{padding:20px 18px 14px;border-bottom:1px solid var(--border-light)}
.panel-tier{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:6px}
.panel-title{font-size:17px;font-weight:500;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.panel-title .pg{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.panel-tags{display:flex;gap:5px;flex-wrap:wrap}
.panel-body{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:18px}
.detail-section{display:flex;flex-direction:column;gap:6px}
.prereq-list{display:flex;flex-direction:column;gap:3px}
.prereq-item{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text-dark);cursor:pointer;padding:4px 6px;border-radius:3px}
.prereq-item:hover{background:var(--bg-hover);color:var(--text-main)}
.prereq-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.panel-footer{padding:12px 18px;border-top:1px solid var(--border-light)}
.btn-trace{width:100%;padding:10px;border-radius:var(--radius-sm);border:1px solid rgba(200,168,75,.4);background:var(--gold-dim);color:var(--gold);font-size:12px;cursor:pointer;font-family:var(--font)}
.btn-trace:hover{background:rgba(200,168,75,.25)}
.btn-clear{width:100%;padding:8px;border-radius:var(--radius-sm);border:1px solid var(--border-light);background:transparent;color:var(--text-dim);font-size:11px;cursor:pointer;font-family:var(--font);margin-top:6px}
.btn-clear:hover{color:var(--text-main)}
/* Career card nodes */
.career-node{position:absolute;width:160px;background:var(--bg-panel-solid);border:1px solid var(--border-light);
  border-radius:var(--radius-sm);padding:10px 12px 10px 14px;cursor:pointer;z-index:2;
  display:flex;flex-direction:column;gap:5px;user-select:none;
  transition:border-color .2s,box-shadow .2s,transform .2s,opacity .35s}
.career-node:hover{border-color:rgba(255,255,255,.28);transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.55)}
.career-node .cn-header{display:flex;align-items:center;gap:8px}
.career-node .cn-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.career-node .cn-title{font-weight:500;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.career-node .cn-meta{font-size:10px;color:var(--text-dim);display:flex;justify-content:space-between}
.career-node .cn-status{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.career-node.cn-tier0{opacity:.65}.career-node.cn-tier0:hover{opacity:.9}
.career-node.cn-tier2{border-color:rgba(170,100,238,.45);background:rgba(170,100,238,.06)}
.career-node.cn-tier2 .cn-dot{background:#aa66ee;box-shadow:0 0 6px rgba(170,100,238,.5)}
.career-node.cn-tier3{border-color:rgba(200,168,75,.45);background:rgba(200,168,75,.06)}
.career-node.cn-tier3 .cn-dot{background:#c8a84b;box-shadow:0 0 6px rgba(200,168,75,.5);border-radius:2px;transform:rotate(45deg)}
.career-node.cn-selected{border-color:var(--accent-blue)!important;background:rgba(58,123,255,.1)!important;
  box-shadow:0 0 0 1px var(--accent-blue),0 0 20px rgba(58,123,255,.2)!important}
.career-edge{fill:none;stroke:rgba(255,255,255,.08);stroke-width:1.5;transition:stroke .3s,stroke-width .3s}
.career-edge.ce-hl{stroke:var(--accent-blue);stroke-width:2;filter:drop-shadow(0 0 4px var(--accent-blue-glow))}
body.light .career-node.cn-tier0{opacity:.55}
body.light .career-edge{stroke:rgba(0,0,0,.08)}
body.light .career-edge.ce-hl{stroke:var(--accent-blue)}
</style>
</head>
<body>
<header>
  <div class="logo">CheckMyStats</div>
  <div class="hdr-path" id="hdr-path"><span>Passive Skill Tree</span></div>
  <div class="hdr-right">
    <button class="hdr-btn" onclick="resetView()">Reset view</button>
    <button class="hdr-btn" onclick="clearPath()">Clear path</button>
    <button class="theme-toggle" onclick="toggleTheme()">
      <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
      <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
  </div>
</header>
<nav class="toolbar">
  <div class="tool-icon active" id="tool-map" onclick="switchMode('map')">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
    <span class="tool-tooltip">Skill Map</span>
  </div>
  <div class="tool-icon" id="tool-add" onclick="openAddCareerModal()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    <span class="tool-tooltip">Add Career Path</span>
  </div>
  <div class="tool-icon" id="tool-resume">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    <span class="tool-tooltip">Resume Builder</span>
  </div>
</nav>
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="search-box" id="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-dim)" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="skill-search" placeholder="Search skills…">
      <div class="search-dropdown" id="search-dropdown"></div>
    </div>
    <div class="mode-tabs">
      <div class="mode-tab active" id="tab-map" onclick="switchMode('map')">Full Map</div>
      <div class="mode-tab" id="tab-careers" onclick="switchMode('careers')">Careers</div>
    </div>
  </div>
  <div class="list-section" id="sidebar-list"></div>
</aside>
<main class="canvas-area">
  <div id="cvs-wrap"><canvas id="cvs"></canvas></div>
  <div id="career-view" style="display:none;position:absolute;inset:0;overflow:hidden;cursor:grab">
    <div id="career-pan" style="position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform">
      <svg id="career-edges" style="position:absolute;top:0;left:0;pointer-events:none;overflow:visible"></svg>
      <div id="career-nodes"></div>
    </div>
  </div>
  <div id="tip"><div id="tip-name"></div><div id="tip-meta"></div></div>
  <div id="path-info" class="path-info"></div>
  <div class="zoom-ctl"><div class="zb" id="zi">+</div><div class="zlbl" id="zlbl">100%</div><div class="zb" id="zo">−</div></div>
  <div class="legend" id="legend-box">
    <div class="leg-row"><div class="leg-dot" style="width:5px;height:5px;border-radius:50%;background:#8899bb"></div><span class="leg-label">Foundation</span></div>
    <div class="leg-row"><div class="leg-dot" style="width:8px;height:8px;border-radius:50%;background:#6688dd"></div><span class="leg-label">Advanced</span></div>
    <div class="leg-row"><div class="leg-dot" style="width:11px;height:11px;border-radius:50%;background:#aa66ee"></div><span class="leg-label">Specialization</span></div>
    <div class="leg-row"><div class="leg-dot" style="width:9px;height:9px;border-radius:2px;background:#c8a84b;transform:rotate(45deg)"></div><span class="leg-label">Career / Cert</span></div>
  </div>
</main>
<aside class="right-panel" id="rpanel">
  <div class="rp-empty" id="rp-empty">Click a node on the map to view details</div>
  <div id="rp-content" style="display:none;flex-direction:column;flex:1;overflow:hidden">
    <div class="panel-header"><div class="panel-tier" id="rp-tier"></div><div class="panel-title"><span class="pg" id="rp-gem"></span><span id="rp-name">—</span></div><div class="panel-tags" id="rp-tags"></div></div>
    <div class="panel-body" id="rp-body"></div>
    <div class="panel-footer"><button class="btn-trace" onclick="traceCurrentNode()">Trace prerequisite path</button><button class="btn-clear" onclick="clearPath()">Clear path</button></div>
  </div>
</aside>
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal"><h3>Add Career Path</h3><p>Choose a specialization to track. Its full prerequisite constellation will be generated.</p><div class="modal-list" id="modal-career-list"></div><button class="modal-cancel" onclick="closeModal()">Cancel</button></div>
</div>

['f_counting','f_addition','f_subtraction','f_multiplication','f_division','f_fractions','f_negative','f_ratios','f_percentages','f_algebra1','f_geometry','f_logic','f_stats_basic','f_sci_method','f_comp_basics','f_spreadsheets','f_algebra2','f_trig','f_precalc','f_calculus1','f_calculus2','f_physics_mech','f_physics_em','f_physics_waves','f_chem_general','f_bio_basic','f_tech_writing'].forEach((id,i,arr)=>{const t=i/(arr.length-1);const r=70+t*350;const a=-Math.PI/2+t*Math.PI*2*2.6;fP[id]={x:CX+Math.cos(a)*(r+(i%3-1)*12),y:CY+Math.sin(a)*(r+(i%3-1)*12)};});

// CAREER PATH — CONVERGENT CONSTELLATION
// ═══════════════════════════════════════════
// Specialization at center, tier 1 in an inner ring,
// tier 0 in an outer ring — like tributaries flowing inward.
// Careers fan out beyond center. Force-relaxed for clean spacing.

function buildFullPath(sid){
  const n=nById[sid];if(!n)return{nodeSet:new Set([sid]),edgeSet:new Set()};
  const ns=new Set(),es=new Set();ns.add(sid);const dc=n.cat;
  const q=[sid],vis=new Set([sid]);
  while(q.length){const cur=q.shift();const cn=nById[cur];if(!cn)continue;
  let acc=[];
  if(cn.tier===3)acc=(prereqOf[cur]||[]).filter(p=>{const pn=nById[p];return pn&&(pn.tier===2?pn.cat===dc:pn.cat===dc||'MATH CS ENG'.includes(pn.cat));});
  else if(cn.tier===2)acc=(prereqOf[cur]||[]).filter(p=>{const pn=nById[p];return pn&&(pn.cat===cn.cat||'MATH CS ENG'.includes(pn.cat));});
  else if(cn.tier===1)acc=(prereqOf[cur]||[]).filter(p=>{const pn=nById[p];return pn&&(pn.tier===0||pn.cat===dc||'MATH CS ENG'.includes(pn.cat));});
  else acc=(prereqOf[cur]||[]).filter(p=>nById[p]?.tier===0);
  for(const pid of acc){es.add(pid+'→'+cur);ns.add(pid);if(!vis.has(pid)){vis.add(pid);q.push(pid);}}}
  return{nodeSet:ns,edgeSet:es};
}

function layoutCareerDAG(specId, nodeSet, edgeSet){
  // Left-to-right horizontal flow matching the OG skill-map card layout.
  // Compute DAG depth per node, then arrange in vertical columns per depth.
  const pos={};const ids=[...nodeSet];
  const depth={};ids.forEach(id=>depth[id]=0);
  let changed=true;
  while(changed){changed=false;edgeSet.forEach(e=>{const[a,b]=e.split('→');
    if(depth[b]!==undefined&&depth[a]!==undefined&&depth[b]<=depth[a]){depth[b]=depth[a]+1;changed=true;}});}
  // Group by column
  const cols={};ids.forEach(id=>{const d=depth[id];if(!cols[d])cols[d]=[];cols[d].push(id);});
  const colKeys=Object.keys(cols).map(Number).sort((a,b)=>a-b);
  // Sort nodes within each column: by category then name for consistency
  colKeys.forEach(c=>{cols[c].sort((a,b)=>{const na=nById[a],nb=nById[b];if(na.cat!==nb.cat)return na.cat<nb.cat?-1:1;return na.name<nb.name?-1:1;});});
  const CARD_W=160,CARD_H=58,COL_GAP=90,ROW_GAP=22;
  const totalCols=colKeys.length;
  const maxRows=Math.max(...colKeys.map(c=>cols[c].length));
  colKeys.forEach((c,ci)=>{
    const rows=cols[c];const groupH=rows.length*(CARD_H+ROW_GAP)-ROW_GAP;
    const totalH=maxRows*(CARD_H+ROW_GAP)-ROW_GAP;
    const yOff=(totalH-groupH)/2;
    rows.forEach((id,ri)=>{
      pos[id]={x:ci*(CARD_W+COL_GAP)+40,y:yOff+ri*(CARD_H+ROW_GAP)+40};
    });
  });
  return pos;
}

function addCareer(specId){
  if(addedCareers.find(c=>c.id===specId))return;
  const n=nById[specId];if(!n)return;
  const{nodeSet,edgeSet}=buildFullPath(specId);
  (leadsTo[specId]||[]).forEach(cid=>{if(nById[cid]?.tier===3){nodeSet.add(cid);edgeSet.add(specId+'→'+cid);}});
  const positions=layoutCareerDAG(specId,nodeSet,edgeSet);
  addedCareers.push({id:specId,name:n.name,cat:n.cat,nodeSet,edgeSet,positions});

}

// ── Career DOM rendering ──
let careerPanState={tx:0,ty:0,scale:1,isPan:false,sx:0,sy:0};
function renderCareerDOM(){
  const c=addedCareers.find(c=>c.id===activeCareer);if(!c)return;
  const nodesEl=document.getElementById('career-nodes');
  const edgesEl=document.getElementById('career-edges');
  const panEl=document.getElementById('career-pan');
  nodesEl.innerHTML='';edgesEl.innerHTML='';
  const CARD_W=160,CARD_H=58;
  const pos=c.positions;
  // Compute bounds for SVG
  const xs=Object.values(pos).map(p=>p.x),ys=Object.values(pos).map(p=>p.y);
  const svgW=Math.max(...xs)+CARD_W+100,svgH=Math.max(...ys)+CARD_H+100;
  edgesEl.setAttribute('width',svgW);edgesEl.setAttribute('height',svgH);
  edgesEl.style.width=svgW+'px';edgesEl.style.height=svgH+'px';
  panEl.style.width=svgW+'px';panEl.style.height=svgH+'px';
  // Draw edges as horizontal beziers
  const edgeArr=[...c.edgeSet].map(e=>e.split('→'));
  edgeArr.forEach(([aId,bId])=>{
    const pa=pos[aId],pb=pos[bId];if(!pa||!pb)return;
    const x1=pa.x+CARD_W,y1=pa.y+CARD_H/2;
    const x2=pb.x,y2=pb.y+CARD_H/2;
    const dx=x2-x1;const cpx=Math.max(Math.abs(dx)*.45,30);
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',`M ${x1} ${y1} C ${x1+cpx} ${y1}, ${x2-cpx} ${y2}, ${x2} ${y2}`);
    path.setAttribute('class','career-edge');
    path.dataset.from=aId;path.dataset.to=bId;
    edgesEl.appendChild(path);
  });
  // Draw nodes as DOM cards
  [...c.nodeSet].forEach(id=>{
    const n=nById[id];if(!n)return;const p=pos[id];if(!p)return;
    const col=CAT_COLOR[n.cat]||'#888';
    const tierCls=n.tier===0?'cn-tier0':n.tier===2?'cn-tier2':n.tier===3?'cn-tier3':'';
    const card=document.createElement('div');
    card.className=`career-node ${tierCls}`;
    card.style.left=p.x+'px';card.style.top=p.y+'px';
    card.dataset.id=id;
    const statusLbl=TIER_LABEL[n.tier]||'';
    const dotStyle=n.tier===3?`background:${col};border-radius:2px;transform:rotate(45deg)`:
      n.tier===2?`background:${col};box-shadow:0 0 6px ${col}`:`background:${col}`;
    card.innerHTML=`<div class="cn-header"><div class="cn-dot" style="${dotStyle}"></div><div class="cn-title">${n.name}</div></div><div class="cn-meta"><span class="cn-status" style="color:${col}">${statusLbl}</span>${n.hrs?'<span>'+n.hrs+'h</span>':''}</div>`;
    card.addEventListener('click',()=>{
      nodesEl.querySelectorAll('.cn-selected').forEach(el=>el.classList.remove('cn-selected'));
      card.classList.add('cn-selected');
      selNode=n;openPanel(n);
      // Highlight path edges
      const path=buildFullPath(id);activePath=path;
      edgesEl.querySelectorAll('.career-edge').forEach(pe=>{
        const key=pe.dataset.from+'→'+pe.dataset.to;
        pe.classList.toggle('ce-hl',path.edgeSet.has(key));
      });
      document.getElementById('path-info').textContent=`${n.name}: ${path.nodeSet.size} nodes · ${path.edgeSet.size} edges`;
      document.getElementById('path-info').classList.add('vis');
    });
    nodesEl.appendChild(card);
  });
  // Fit view
  const viewEl=document.getElementById('career-view');
  const vw=viewEl.offsetWidth,vh=viewEl.offsetHeight;
  const bx1=Math.max(...xs)+CARD_W+40,by1=Math.max(...ys)+CARD_H+40;
  const bx0=Math.min(...xs)-40,by0=Math.min(...ys)-40;
  const ts=Math.min(vw/(bx1-bx0),vh/(by1-by0),1.8);
  careerPanState={tx:vw/2-(bx0+bx1)/2*ts,ty:vh/2-(by0+by1)/2*ts,scale:ts,isPan:false,sx:0,sy:0};
  applyCareerTransform();
}
function applyCareerTransform(){
  const s=careerPanState;
  document.getElementById('career-pan').style.transform=`translate(${s.tx}px,${s.ty}px) scale(${s.scale})`;
  zlbl.textContent=Math.round(s.scale*100)+'%';
}
// Career view pan/zoom
(function(){
  const cv=document.getElementById('career-view');
  cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;
    const ns=Math.max(.15,Math.min(4,careerPanState.scale*(e.deltaY<0?1.12:.9)));
    careerPanState.tx=mx-(mx-careerPanState.tx)*(ns/careerPanState.scale);
    careerPanState.ty=my-(my-careerPanState.ty)*(ns/careerPanState.scale);
    careerPanState.scale=ns;applyCareerTransform();},{passive:false});
  cv.addEventListener('mousedown',e=>{if(e.target.closest('.career-node'))return;
    careerPanState.isPan=true;careerPanState.sx=e.clientX-careerPanState.tx;careerPanState.sy=e.clientY-careerPanState.ty;cv.style.cursor='grabbing';});
  window.addEventListener('mousemove',e=>{if(!careerPanState.isPan)return;
    careerPanState.tx=e.clientX-careerPanState.sx;careerPanState.ty=e.clientY-careerPanState.sy;applyCareerTransform();});
  window.addEventListener('mouseup',()=>{careerPanState.isPan=false;document.getElementById('career-view').style.cursor='grab';});
})();

function resize(){const dpr=devicePixelRatio||1;cvs.width=wrap.offsetWidth*dpr;cvs.height=wrap.offsetHeight*dpr;cvs.style.width=wrap.offsetWidth+'px';cvs.style.height=wrap.offsetHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0);}
window.addEventListener('resize',resize);
function w2s(x,y){return{sx:x*vScale+vTx,sy:y*vScale+vTy};}
function isL(){return document.body.classList.contains('light');}
function gNP(id){if(activeCareer){const c=addedCareers.find(c=>c.id===activeCareer);if(c?.positions[id])return c.positions[id];}return fP[id];}
function gVN(){if(activeCareer){const c=addedCareers.find(c=>c.id===activeCareer);return c?SKILL_NODES.filter(n=>c.nodeSet.has(n.id)):[];}return SKILL_NODES;}
function gVE(){if(activeCareer){const c=addedCareers.find(c=>c.id===activeCareer);return c?EDGES.filter(([a,b])=>c.nodeSet.has(a)&&c.nodeSet.has(b)):[];}return EDGES;}

function draw(){
  const W=wrap.offsetWidth,H=wrap.offsetHeight,li=isL();
  ctx.clearRect(0,0,W,H);ctx.fillStyle=li?'#EEF0F8':'#0e0e1a';ctx.fillRect(0,0,W,H);
  const{sx:ccx,sy:ccy}=w2s(CX,CY);const inC=!!activeCareer;
  // Full map background
  if(!inC){
    if(!li){Object.entries(DS).forEach(([cat,sec])=>{if(!sec.s||sec.s>Math.PI)return;const r1=160*vScale*.5,r2=R_PHDC*vScale*1.08;ctx.save();ctx.globalAlpha=.02;ctx.beginPath();ctx.moveTo(ccx+Math.cos(sec.a-sec.s/2)*r1,ccy+Math.sin(sec.a-sec.s/2)*r1);ctx.arc(ccx,ccy,r2,sec.a-sec.s/2,sec.a+sec.s/2);ctx.arc(ccx,ccy,r1,sec.a+sec.s/2,sec.a-sec.s/2,true);ctx.closePath();ctx.fillStyle=CAT_COLOR[cat]||'#888';ctx.fill();ctx.restore();});
      if(!_stars){_stars=[];for(let i=0;i<300;i++)_stars.push({x:(Math.random()-.5)*6000+CX,y:(Math.random()-.5)*6000+CY,r:Math.random()*.7+.2,a:Math.random()*.12+.03});}
      _stars.forEach(s=>{const{sx,sy}=w2s(s.x,s.y);if(sx<-2||sx>W+2||sy<-2||sy>H+2)return;ctx.beginPath();ctx.arc(sx,sy,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(200,210,235,${s.a})`;ctx.fill();});}
    RINGS.forEach(ring=>{const sr=ring.r*vScale;ctx.save();ctx.beginPath();ctx.arc(ccx,ccy,sr,0,Math.PI*2);ctx.strokeStyle=li?'rgba(140,120,60,.25)':'rgba(200,180,120,.18)';ctx.lineWidth=1.5;ctx.stroke();ctx.globalAlpha=li?.02:.015;ctx.beginPath();ctx.arc(ccx,ccy,sr,0,Math.PI*2);ctx.fillStyle=li?'rgba(140,120,60,1)':'rgba(200,180,120,1)';ctx.fill();ctx.restore();const lx=ccx+Math.cos(ring.la)*sr,ly=ccy+Math.sin(ring.la)*sr;const fs=Math.max(11,16*vScale);ctx.save();ctx.font=`600 ${fs}px -apple-system,sans-serif`;ctx.textAlign='left';ctx.fillStyle=li?'rgba(120,100,40,.55)':'rgba(200,180,120,.4)';if(!li){ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=4;}ctx.fillText(ring.l,lx+8,ly-6);ctx.restore();});
  }
  // Career background — horizontal tier bands with downward flow
  if(inC){
    const c=addedCareers.find(c=>c.id===activeCareer);if(c){
      const pos=c.positions;const allY=Object.values(pos).map(p=>p.y);
      const minY=Math.min(...allY)-60,maxY=Math.max(...allY)+60;
      // Collect tier rows for band labeling
      const tierYs={0:[],1:[],2:[],3:[]};
      [...c.nodeSet].forEach(id=>{const n=nById[id];if(n&&pos[id])tierYs[n.tier].push(pos[id].y);});
      const tierBands=[];
      [0,1,2,3].forEach(t=>{if(!tierYs[t].length)return;
        const my=tierYs[t].reduce((a,b)=>a+b,0)/tierYs[t].length;
        tierBands.push({tier:t,y:my,label:['Foundations','Advanced','Specialization','Careers'][t]});
      });
      // Draw band backgrounds
      const col=CAT_COLOR[c.cat]||'#888';
      tierBands.forEach((band,i)=>{
        const{sy}=w2s(0,band.y);const bandH=100*vScale;
        ctx.save();ctx.globalAlpha=li?.03:.04;
        ctx.fillStyle=col;
        ctx.fillRect(0,sy-bandH/2,W,bandH);
        ctx.restore();
        // Band label on the left
        const fs=Math.max(9,11*vScale);
        ctx.save();ctx.font=`600 ${fs}px -apple-system,sans-serif`;ctx.textAlign='left';
        ctx.fillStyle=li?'rgba(0,0,0,.12)':'rgba(255,255,255,.1)';
        ctx.fillText(band.label.toUpperCase(),12,sy+fs/3);ctx.restore();
      });
      // Downward flow arrows in background
      const{sx:cx2,sy:topY}=w2s(1200,minY);const{sy:botY}=w2s(0,maxY);
      for(let i=0;i<3;i++){
        const x=cx2+(i-1)*120*vScale;
        ctx.save();ctx.globalAlpha=li?.04:.05;ctx.strokeStyle=col;ctx.lineWidth=1;
        ctx.setLineDash([3,10]);ctx.beginPath();ctx.moveTo(x,topY);ctx.lineTo(x,botY);ctx.stroke();
        ctx.setLineDash([]);ctx.restore();
      }
    }
  }
  // Edges
  const ve=gVE();
  ve.forEach(([aId,bId])=>{const pa=gNP(aId),pb=gNP(bId);if(!pa||!pb)return;
    const{sx:ax,sy:ay}=w2s(pa.x,pa.y),{sx:bx,sy:by}=w2s(pb.x,pb.y);
    const na=nById[aId];const onP=activePath?.edgeSet.has(aId+'→'+bId);
    const dim=activePath&&!onP;const catDim=!inC&&activeCatFilter&&na?.cat!==activeCatFilter&&nById[bId]?.cat!==activeCatFilter;
    ctx.save();

      const dy2=by-ay;const cpOff=Math.abs(dy2)*.4;
      ctx.beginPath();ctx.moveTo(ax,ay);ctx.bezierCurveTo(ax,ay+cpOff,bx,by-cpOff,bx,by);ctx.stroke();

      ctx.fillStyle=CAT_COLOR[na?.cat]||'#888';ctx.globalAlpha=li?.3:.4;ctx.fill();

    } else{ctx.globalAlpha=li?.14:.16;ctx.strokeStyle=CAT_COLOR[na?.cat]||'#888';ctx.lineWidth=.7;}
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();ctx.restore();});

  // Particles flowing downward (career mode)
  if(inC&&particles.length){
    particleTime++;
    particles.forEach(p=>{
      p.t+=p.speed;if(p.t>1)p.t-=1;
      const pa=gNP(p.a),pb=gNP(p.b);if(!pa||!pb)return;
      const{sx:ax,sy:ay}=w2s(pa.x,pa.y),{sx:bx,sy:by}=w2s(pb.x,pb.y);

      const col=CAT_COLOR[nById[p.a]?.cat]||'#888';

    });

    else if(n.tier===3){ctx.shadowColor=col;ctx.shadowBlur=isS||onP?20:6;ctx.beginPath();ctx.moveTo(sx,sy-r*1.4);ctx.lineTo(sx+r*.9,sy);ctx.lineTo(sx,sy+r*1.4);ctx.lineTo(sx-r*.9,sy);ctx.closePath();ctx.fillStyle=col;ctx.fill();if(isS||onP){ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();}ctx.shadowBlur=0;ctx.beginPath();ctx.arc(sx,sy,r*.25,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.6)';ctx.fill();}
    else if(n.tier===1){ctx.shadowColor=col;ctx.shadowBlur=onP?14:isH?8:0;ctx.beginPath();ctx.arc(sx,sy,r,0,Math.PI*2);if(onP||inC){ctx.fillStyle=onP?col:(li?'rgba(200,210,240,.85)':'rgba(20,22,35,.95)');ctx.fill();ctx.strokeStyle=onP?'rgba(255,255,255,.5)':col;ctx.lineWidth=onP?1.2:1;ctx.stroke();}else{ctx.fillStyle=li?'rgba(200,210,240,.7)':'rgba(20,22,35,.9)';ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=1;ctx.stroke();}}

    ctx.shadowBlur=0;
    const showLbl=inC||n.tier>=2||vScale>.35||isH||isS||onP;
    if(showLbl){const fs=n.tier>=2?Math.max(10,12*vScale):Math.max(9,10*vScale);ctx.globalAlpha=dim?.06:n.tier>=2?.95:.80;ctx.font=`${n.tier>=2?'600':'400'} ${fs}px -apple-system,sans-serif`;ctx.textAlign='center';if(!li){ctx.shadowColor='rgba(0,0,0,.9)';ctx.shadowBlur=4;}ctx.fillStyle=li?'rgba(10,10,30,.9)':'rgba(225,228,245,.95)';ctx.fillText(n.name,sx,sy+r*1.5+fs+1);if(n.level&&(vScale>.3||isH||isS||onP)){ctx.font=`500 ${Math.max(8,9*vScale)}px -apple-system,sans-serif`;ctx.fillStyle=li?'rgba(100,90,50,.5)':'rgba(200,180,120,.45)';ctx.fillText(n.level.toUpperCase(),sx,sy+r*1.5+fs+1+fs*.85);}ctx.shadowBlur=0;}
    ctx.restore();});
  if(!inC&&vScale<.28){Object.entries(DS).forEach(([cat,sec])=>{if(!sec.s||sec.s>Math.PI||cat==='CRED')return;const{sx,sy}=w2s(CX+Math.cos(sec.a)*(R_T1+80),CY+Math.sin(sec.a)*(R_T1+80));if(sx<0||sx>W||sy<0||sy>H)return;ctx.save();ctx.globalAlpha=Math.max(0,(.28-vScale)/.18*.6);ctx.font=`600 ${Math.max(11,13*vScale)}px -apple-system,sans-serif`;ctx.textAlign='center';ctx.fillStyle=CAT_COLOR[cat]||'#888';ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=6;ctx.fillText(CAT_NAMES[cat]||cat,sx,sy);ctx.restore();});}
}
function tick(){draw();requestAnimationFrame(tick);}

// Interaction
wrap.addEventListener('wheel',e=>{e.preventDefault();const r=wrap.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;const ns=Math.max(.05,Math.min(5,vScale*(e.deltaY<0?1.13:.885)));vTx=mx-(mx-vTx)*(ns/vScale);vTy=my-(my-vTy)*(ns/vScale);vScale=ns;zlbl.textContent=Math.round(vScale*100)+'%';},{passive:false});
wrap.addEventListener('mousedown',e=>{isPan=true;psx=e.clientX-vTx;psy=e.clientY-vTy;wrap.style.cursor='grabbing';});
window.addEventListener('mousemove',e=>{if(isPan){vTx=e.clientX-psx;vTy=e.clientY-psy;}else hoverCheck(e);});
window.addEventListener('mouseup',()=>{isPan=false;wrap.style.cursor='grab';});
document.getElementById('zi').onclick=()=>zoomBy(1.3);document.getElementById('zo').onclick=()=>zoomBy(.75);
function zoomBy(f){const cx=wrap.offsetWidth/2,cy=wrap.offsetHeight/2;const ns=Math.max(.05,Math.min(5,vScale*f));vTx=cx-(cx-vTx)*(ns/vScale);vTy=cy-(cy-vTy)*(ns/vScale);vScale=ns;zlbl.textContent=Math.round(vScale*100)+'%';}

const tip=document.getElementById('tip');
function hoverCheck(e){const r=wrap.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;let found=null,md=Infinity;
  gVN().forEach(n=>{const p=gNP(n.id);if(!p)return;const{sx,sy}=w2s(p.x,p.y);const hit=(n.tier===0?6:n.tier===1?10:n.tier===2?16:12)*Math.min(vScale*1.1,1.4)+10;const d=Math.hypot(mx-sx,my-sy);if(d<hit&&d<md){md=d;found=n;}});
  hovNode=found;if(found){document.getElementById('tip-name').textContent=found.name;
    const parts=[TIER_LABEL[found.tier],CAT_NAMES[found.cat]];if(found.edu)parts.push(EDU_LABELS[found.edu]);if(found.hrs)parts.push(found.hrs+'h');if(found.level)parts.push(found.level.toUpperCase());parts.push((prereqOf[found.id]||[]).length+' prereqs');
    document.getElementById('tip-meta').textContent=parts.filter(Boolean).join(' · ');tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY-8)+'px';tip.classList.add('vis');wrap.style.cursor='pointer';}
  else{tip.classList.remove('vis');if(!isPan)wrap.style.cursor='grab';}}

wrap.addEventListener('click',e=>{const r=wrap.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;let cl=null,md=Infinity;
  gVN().forEach(n=>{const p=gNP(n.id);if(!p)return;const{sx,sy}=w2s(p.x,p.y);const d=Math.hypot(mx-sx,my-sy);if(d<(n.tier===0?6:n.tier===1?10:n.tier===2?16:12)*Math.min(vScale*1.1,1.4)+10&&d<md){md=d;cl=n;}});
  if(cl){selNode=cl;openPanel(cl);highlightPath(cl.id);}});

function highlightPath(id){activePath=buildFullPath(id);const n=nById[id];const pi=document.getElementById('path-info');pi.textContent=`${n?n.name+': ':''}${activePath.nodeSet.size} nodes · ${activePath.edgeSet.size} edges`;pi.classList.add('vis');}
function traceCurrentNode(){if(selNode)highlightPath(selNode.id);}
function clearPath(){activePath=null;document.getElementById('path-info').classList.remove('vis');}

function openPanel(n){document.getElementById('rp-empty').style.display='none';document.getElementById('rp-content').style.display='flex';
  const col=CAT_COLOR[n.cat]||'#888';let tt=TIER_LABEL[n.tier]||'';if(n.edu)tt+=' · '+(EDU_LABELS[n.edu]||n.edu);if(n.level)tt+=' · '+n.level.toUpperCase();
  document.getElementById('rp-tier').textContent=tt;document.getElementById('rp-gem').style.background=col;document.getElementById('rp-name').textContent=n.name;
  const tags=[`<span class="pill-tag" style="border-color:${col}44;color:${col}">${CAT_NAMES[n.cat]||n.cat}</span>`];if(n.hrs)tags.push(`<span class="pill-tag">${n.hrs}h</span>`);if(n.edu)tags.push(`<span class="pill-tag">${EDU_LABELS[n.edu]}</span>`);if(n.level)tags.push(`<span class="pill-tag">${n.level.toUpperCase()}</span>`);tags.push(`<span class="pill-tag">Tier ${n.tier}</span>`);
  document.getElementById('rp-tags').innerHTML=tags.join('');
  const pre=(prereqOf[n.id]||[]).map(id=>nById[id]).filter(Boolean),leads=(leadsTo[n.id]||[]).map(id=>nById[id]).filter(Boolean);
  let h='';if(pre.length)h+=`<div class="detail-section"><span class="label-caps">Prerequisites (${pre.length})</span><div class="prereq-list">${pre.map(p=>`<div class="prereq-item" onclick="selAndTrace('${p.id}')"><div class="prereq-dot" style="background:${CAT_COLOR[p.cat]||'#888'}"></div>${p.name}</div>`).join('')}</div></div>`;
  if(leads.length)h+=`<div class="detail-section"><span class="label-caps">Leads to (${leads.length})</span><div class="prereq-list">${leads.slice(0,15).map(l=>`<div class="prereq-item" onclick="selAndTrace('${l.id}')"><div class="prereq-dot" style="background:${CAT_COLOR[l.cat]||'#888'}"></div>${l.name}${l.level?' <span style="color:var(--text-dim);font-size:9px">'+l.level.toUpperCase()+'</span>':''}</div>`).join('')}${leads.length>15?`<div style="font-size:11px;color:var(--text-dim);margin-top:4px">+${leads.length-15} more</div>`:''}</div></div>`;
  if(!pre.length&&!leads.length)h='<p style="font-size:12px;color:var(--text-dark);padding:8px 0">No connections.</p>';
  document.getElementById('rp-body').innerHTML=h;}
function selAndTrace(id){const n=nById[id];if(n){selNode=n;openPanel(n);highlightPath(id);const p=gNP(id);if(p){const ts=Math.max(vScale,.5);animateTo(wrap.offsetWidth/2-p.x*ts,wrap.offsetHeight/2-p.y*ts,ts,500);}}}

// Search
const si=document.getElementById('skill-search'),dd=document.getElementById('search-dropdown');let sIds=[],sIdx=-1;
function renderDD(q){q=q.trim().toLowerCase();if(!q){dd.classList.remove('visible');return;}const pool=gVN();const m=pool.filter(n=>n.name.toLowerCase().includes(q)).slice(0,10);sIds=m.map(n=>n.id);sIdx=m.length?0:-1;
  if(!m.length){dd.innerHTML='<div class="search-no-results">No skills found</div>';dd.classList.add('visible');return;}
  dd.innerHTML=m.map((n,i)=>`<div class="search-result-item${i===0?' hi':''}" data-id="${n.id}"><div class="search-result-name">${hlQ(n.name,q)}</div><div class="search-result-meta"><span>${CAT_NAMES[n.cat]||''}</span><span>${TIER_LABEL[n.tier]}</span></div></div>`).join('');dd.classList.add('visible');dd.querySelectorAll('.search-result-item').forEach(el=>el.addEventListener('mousedown',e=>{e.preventDefault();pickR(el.dataset.id);}));}
function hlQ(t,q){const i=t.toLowerCase().indexOf(q);if(i<0)return t;return t.slice(0,i)+`<strong style="color:var(--text-main)">${t.slice(i,i+q.length)}</strong>`+t.slice(i+q.length);}
function pickR(id){si.value='';dd.classList.remove('visible');const n=nById[id];if(n){selNode=n;openPanel(n);highlightPath(id);const p=gNP(id);if(p){const ts=Math.max(vScale,.5);animateTo(wrap.offsetWidth/2-p.x*ts,wrap.offsetHeight/2-p.y*ts,ts,500);}}}
si.addEventListener('input',e=>renderDD(e.target.value));
si.addEventListener('keydown',e=>{if(!dd.classList.contains('visible'))return;const items=dd.querySelectorAll('.search-result-item');if(e.key==='ArrowDown'){e.preventDefault();sIdx=Math.min(sIdx+1,items.length-1);items.forEach((el,i)=>el.classList.toggle('hi',i===sIdx));}else if(e.key==='ArrowUp'){e.preventDefault();sIdx=Math.max(sIdx-1,0);items.forEach((el,i)=>el.classList.toggle('hi',i===sIdx));}else if(e.key==='Enter'&&sIdx>=0)pickR(sIds[sIdx]);else if(e.key==='Escape')dd.classList.remove('visible');});
document.addEventListener('mousedown',e=>{if(!e.target.closest('#search-wrap'))dd.classList.remove('visible');});

function resetView(){const ts=Math.min(wrap.offsetWidth/(R_PHDC*2.2),wrap.offsetHeight/(R_PHDC*2.2));animateTo(wrap.offsetWidth/2-CX*ts,wrap.offsetHeight/2-CY*ts,ts,600);}
function animateTo(tx,ty,sc,dur){const s0=vTx,t0=vTy,sc0=vScale,st=performance.now();function ease(x){return x<.5?2*x*x:-1+(4-2*x)*x;}function step(now){const p=Math.min(1,(now-st)/dur),e=ease(p);vTx=s0+(tx-s0)*e;vTy=t0+(ty-t0)*e;vScale=sc0+(sc-sc0)*e;zlbl.textContent=Math.round(vScale*100)+'%';if(p<1)requestAnimationFrame(step);}requestAnimationFrame(step);}
function toggleTheme(){document.body.classList.toggle('light');_stars=null;}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();dd.classList.remove('visible');}});

resize();resetView();tick();
</script>
</body>
</html>
